name: Publish

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: okkema/actions/npm-publish@v2
        with:
          version: ${{ github.event.release.tag_name }}
          commit: 'true'
          access: 'public'
          node-version-file: '.nvmrc'
